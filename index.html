.st div{background:var(--bg);border-radius:12px;padding:10px 12px}.st b{display:block;font:700 1.4rem/1.2 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ac)}.st span{font-size:.8rem;color:var(--mut)}
