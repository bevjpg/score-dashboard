(12),k=await crypto.subtle.importKey(\"raw\",kb,\"AES-GCM\",false,[\"encrypt\"]),ct=new Uint8Array(await crypto.subtle.encrypt({name:\"AES-GCM\",iv},k,new TextEncoder().encode(JSON.stringify(obj)))),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}\nfunction parseXlsx(buf){\n  const wb=XLSX.read(buf,{type:\"array\"}),ws=wb.Sheets[wb.SheetNames[0]],c=a=>ws[a]?ws[a].v:undefined;\n  const WW=[...\"GHIJK\"],PT=[...\"OPQRS\"],ST=[\"W\",\"X\",\"Y\"],errs=[],warns=[],recs=[];\n  const meta={ww:WW.map(x=>c(x+\"10\")),pt:PT.map(x=>c(x+\"10\")),st:ST.map(x=>c(x+\"10\"))};\n  if(![...meta.ww,...meta.pt,...meta.st].every(NUM))return{errs:[\"The highest possible scores in row 10 were not found. Use your class record without moving columns.\"],warns,recs,meta};\n  const hn=wb.SheetNames.find(n=>n.includes(\"Helper\")),hs=hn&&wb.Sheets[hn],hv=a=>hs&&hs[a]?hs[a].v:undefined,trans=[],desc=[];\n  for(let r=3;r\u003c=43;r++)if(NUM(hv(\"H\"+r)))trans.push([hv(\"H\"+r),hv(\"K\"+r)]);\n  for(let r=3;r\u003c=7;r++)if(NUM(hv(\"T\"+r)))desc.push([hv(\"T\"+r),String(hv(\"W\"+r)).trim()]);\n  if(!trans.length||!desc.length)return{errs:[\"The transmutation table (Helper sheet) was not found.\"],warns,recs,meta};\n  const num=(r,col,label,hi)=>{const v=c(col+r);if(v===undefined||v===null||(typeof v===\"string\"&&!v.trim()))return null;if(!NUM(v)){errs.push(`Row ${r}: ${label} is not a number (${v})`);return null}if(v\u003c0||v>hi)errs.push(`Row ${r}: ${label} = ${v} is outside 0\u2013${hi}`);return v};\n  let section=null;const end=XLSX.utils.decode_range(ws[\"!ref\"]).e.r+1;\n  for(let r=12;r\u003c=end;r++){\n    const lraw=c(\"A\"+r),nm=c(\"C\"+r);\n    if(!lraw&&nm&&/^\\s*\\d{1,2}\\s*-/.test(String(nm))){section=String(nm).trim();continue}\n    const has=[...WW,...PT,...ST].some(x=>c(x+r)!==undefined&&c(x+r)!==\"\");\n    if(!(lraw||nm||has)||!section)continue;\n    const name=nm?String(nm).trim():\"\";\n    if(!name){errs.push(`Row ${r}: learner name is missing (LRN ${lra
